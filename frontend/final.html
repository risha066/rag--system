<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DocuAI Direct Portal</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 580px; margin: 40px auto; padding: 20px; background: #f1f5f9; }
        .box { background: white; padding: 25px; border-radius: 12px; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        input, button, textarea { padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; }
        button { background: #4f46e5; color: white; border: none; font-weight: 600; cursor: pointer; }
        button:hover { background: #4338ca; }
        .hidden { display: none; }
        .success { color: #16a34a; }
        .error { color: #dc2626; }
        #answer, #ingestMsg, #msg { margin-top: 10px; padding: 12px; border-radius: 8px; background: #f8fafc; font-size: 14px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="margin-top:0; color:#0f172a;">📚 DocuAI Quick Portal</h2>

    <div id="loginDiv">
        <input type="email" id="email" value="newuser@email.com" placeholder="Email">
        <input type="password" id="password" value="securepass123" placeholder="Password">
        <button onclick="login()">Log In</button>
        <div id="msg"></div>
    </div>

    <div id="appDiv" class="hidden">
        <h3>1. Ingest Text</h3>
        <input type="text" id="title" placeholder="Document Title (e.g. Overview)">
        <textarea id="text" rows="4" placeholder="Document content..."></textarea>
        <button onclick="ingest()">Ingest into Vector DB</button>
        <div id="ingestMsg"></div>

        <h3 style="margin-top: 25px;">2. Ask Question</h3>
        <input type="text" id="question" placeholder="Ask question..." onkeydown="if(event.key==='Enter') ask()">
        <button onclick="ask()">Ask DocuAI</button>
        <div id="answer"></div>

        <button onclick="logout()" style="background:#ef4444; margin-top:25px;">Log Out</button>
    </div>
</div>

<script>
    const API = (window.location.protocol.startsWith('http')) ? window.location.origin : 'http://localhost:8000';
    let token = localStorage.getItem('docuai_token');

    if (token) {
        document.getElementById('loginDiv').classList.add('hidden');
        document.getElementById('appDiv').classList.remove('hidden');
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msg = document.getElementById('msg');
        msg.textContent = 'Authenticating...';

        try {
            const fd = new URLSearchParams();
            fd.append('username', email);
            fd.append('password', password);

            const res = await fetch(API + '/auth/login', { method: 'POST', body: fd });
            const data = await res.json();

            if (res.ok) {
                token = data.access_token;
                localStorage.setItem('docuai_token', token);
                msg.innerHTML = '<span class="success">✅ Login success!</span>';
                setTimeout(() => {
                    document.getElementById('loginDiv').classList.add('hidden');
                    document.getElementById('appDiv').classList.remove('hidden');
                }, 300);
            } else {
                msg.innerHTML = '<span class="error">❌ ' + (data.detail || 'Login failed') + '</span>';
            }
        } catch(e) {
            msg.innerHTML = '<span class="error">❌ Backend unreachable at ' + API + '</span>';
        }
    }

    async function ingest() {
        const title = document.getElementById('title').value;
        const text = document.getElementById('text').value;
        const ingestMsg = document.getElementById('ingestMsg');
        if (!title || !text) return alert("Title and text required");

        ingestMsg.textContent = '⏳ Ingesting and embedding...';
        try {
            const docId = title.toLowerCase().replace(/[^a-z0-9]+/g, '_');
            const res = await fetch(API + '/ingest', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ document_id: docId, title: title, text: text })
            });
            const data = await res.json();
            ingestMsg.innerHTML = '<span class="success">✅ Ingested (' + data.chunks + ' chunks)</span>';
        } catch(e) {
            ingestMsg.innerHTML = '<span class="error">❌ ' + e.message + '</span>';
        }
    }

    async function ask() {
        const question = document.getElementById('question').value;
        const answerDiv = document.getElementById('answer');
        if (!question) return;

        answerDiv.textContent = '⏳ Querying...';
        try {
            const res = await fetch(API + '/query', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            });
            const data = await res.json();
            answerDiv.textContent = data.answer || 'No answer';
        } catch(e) {
            answerDiv.textContent = '❌ ' + e.message;
        }
    }

    function logout() {
        localStorage.removeItem('docuai_token');
        location.reload();
    }
</script>

</body>
</html>
