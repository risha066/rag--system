<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyAI Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0f4ff;min-height:100vh;display:flex;justify-content:center;align-items:center}
.container{background:#fff;padding:30px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.15);width:100%;max-width:800px;max-height:95vh;overflow-y:auto}
.logo-text{font-size:28px;font-weight:700;text-align:center}
.logo-text span{color:#7c3aed}
.subtitle{text-align:center;color:#666;margin-bottom:20px}
.nav-bar{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}
.nav-bar button{padding:8px 16px;border:2px solid #ddd;background:#fff;border-radius:8px;cursor:pointer}
.nav-bar button.active{border-color:#7c3aed;background:#ede9fe;color:#7c3aed}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat-card{background:#f8f9fa;padding:16px;border-radius:12px;text-align:center}
.stat-card h3{font-size:13px;color:#888}
.stat-card p{font-size:26px;font-weight:700}
.btn{padding:10px 20px;background:#7c3aed;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{background:#6d28d9}
.btn-sm{padding:4px 12px;font-size:12px}
.btn-green{background:#2ecc71}.btn-green:hover{background:#27ae60}
.btn-blue{background:#3498db}.btn-blue:hover{background:#2980b9}
.btn-red{background:#e74c3c}.btn-red:hover{background:#c0392b}
.btn-full{width:100%}
.doc-list{list-style:none}
.doc-list li{background:#f8f9fa;padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.doc-actions{display:flex;gap:5px;flex-wrap:wrap}
.doc-actions .btn{padding:4px 10px;font-size:11px}
.chat-box{background:#f8f9fa;border-radius:12px;padding:16px;height:250px;overflow-y:auto;margin-bottom:12px}
.chat-msg{padding:8px 14px;border-radius:12px;margin-bottom:8px;max-width:80%}
.chat-msg.user{background:#7c3aed;color:#fff;margin-left:auto}
.chat-msg.bot{background:#fff;border:1px solid #ddd}
.chat-input{display:flex;gap:10px}
.chat-input input{flex:1;padding:12px;border:2px solid #ddd;border-radius:8px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:5px;font-weight:500}
.form-group input,.form-group textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:14px}
.hidden{display:none}
.ingest-section{background:#f8f9fa;padding:16px;border-radius:12px;margin-bottom:16px}
.footer{text-align:center;color:#888;font-size:12px;margin-top:20px;border-top:1px solid #ddd;padding-top:15px}
.brand-name{color:#7c3aed}
.message{padding:10px;border-radius:8px;margin-top:15px}
.message.success{background:#d4edda;color:#155724}
.message.error{background:#f8d7da;color:#721c24}
.link{text-align:center;margin-top:15px}
.link a{color:#7c3aed;cursor:pointer}
.mt-10{margin-top:10px}
.search-result{background:#f8f9fa;padding:12px;border-radius:8px;margin-bottom:8px}
.flex{display:flex;gap:10px;align-items:center}
.flex-1{flex:1}
</style>
</head>
<body>
<div class="container" id="app">

  <div id="authSection">
    <div class="logo-text">📚 <span>MyAI</span> Assistant</div>
    <p class="subtitle">Your Smart Document Intelligence</p>

    <div id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="email" value="newuser@email.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" value="securepass123"></div>
      <button class="btn btn-full" onclick="login()">Login</button>
      <div class="link">Don't have an account? <a onclick="showRegister()">Register</a></div>
      <div id="authMsg" class="message hidden"></div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="form-group"><label>Email</label><input type="email" id="regEmail"></div>
      <div class="form-group"><label>Password</label><input type="password" id="regPassword"></div>
      <button class="btn btn-full" onclick="register()">Register</button>
      <div class="link">Already have an account? <a onclick="showLogin()">Login</a></div>
      <div id="regMsg" class="message hidden"></div>
    </div>
  </div>

  <div id="appSection" class="hidden">
    <div class="logo-text" style="font-size:22px;">📚 <span>MyAI</span> Assistant</div>
    <div class="nav-bar">
      <button onclick="showPage('dashboard')" id="navDashboard">📊 Dashboard</button>
      <button onclick="showPage('ingest')" id="navIngest">📤 Ingest</button>
      <button onclick="showPage('chat')" id="navChat">💬 Chat</button>
      <button onclick="showPage('documents')" id="navDocs">📁 Documents</button>
      <button onclick="showPage('search')" id="navSearch">🔍 Search</button>
      <button onclick="logout()" style="border-color:#e74c3c;color:#e74c3c;">🚪 Logout</button>
    </div>
    <div id="pageContent"></div>
  </div>

  <div class="footer">© 2026 <span class="brand-name">MyAI Assistant</span> - All rights reserved</div>
</div>

<script>
const API = 'https://incredible-intuition-production-a491.up.railway.app';
let token = localStorage.getItem('kg_token');

function showRegister(){document.getElementById('loginForm').classList.add('hidden');document.getElementById('registerForm').classList.remove('hidden');document.getElementById('authMsg').classList.add('hidden');}
function showLogin(){document.getElementById('loginForm').classList.remove('hidden');document.getElementById('registerForm').classList.add('hidden');document.getElementById('regMsg').classList.add('hidden');}
function showAuthMsg(m,t){const e=document.getElementById('authMsg');e.textContent=m;e.className='message '+t;e.classList.remove('hidden');}
function showRegMsg(m,t){const e=document.getElementById('regMsg');e.textContent=m;e.className='message '+t;e.classList.remove('hidden');}

async function login(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  if(!email||!password){showAuthMsg('Please enter email and password','error');return;}
  try{
    const fd=new URLSearchParams();fd.append('username',email);fd.append('password',password);
    const res=await fetch(API+'/auth/login',{method:'POST',body:fd});
    const data=await res.json();
    if(res.ok){
      token=data.access_token;localStorage.setItem('kg_token',token);localStorage.setItem('kg_user',email);
      showAuthMsg('✅ Login successful!','success');
      setTimeout(()=>{document.getElementById('authSection').classList.add('hidden');document.getElementById('appSection').classList.remove('hidden');showPage('dashboard');},500);
    } else { showAuthMsg('❌ '+(data.detail||'Login failed'),'error'); }
  } catch(e){ showAuthMsg('❌ '+e.message,'error'); }
}

async function register(){
  const email=document.getElementById('regEmail').value;
  const password=document.getElementById('regPassword').value;
  if(!email||!password){showRegMsg('Please enter email and password','error');return;}
  try{
    const res=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(res.ok){ showRegMsg('✅ Registered! Please login.','success'); setTimeout(showLogin,1000); }
    else { showRegMsg('❌ '+(data.detail||'Registration failed'),'error'); }
  } catch(e){ showRegMsg('❌ '+e.message,'error'); }
}

function logout(){localStorage.removeItem('kg_token');localStorage.removeItem('kg_user');token=null;document.getElementById('appSection').classList.add('hidden');document.getElementById('authSection').classList.remove('hidden');document.getElementById('pageContent').innerHTML='';}

function apiCall(endpoint,method,body){
  method=method||'GET';
  const t=localStorage.getItem('kg_token');
  if(!t)return Promise.reject(new Error('Not authenticated'));
  const options={method:method,headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'}};
  if(body)options.body=JSON.stringify(body);
  return fetch(API+endpoint,options).then(res=>{
    if(res.status===401){logout();throw new Error('Session expired');}
    if(!res.ok){return res.json().then(err=>{throw new Error(err.detail||'Request failed');});}
    return res.json();
  });
}

function showPage(page){
  document.querySelectorAll('.nav-bar button').forEach(b=>b.classList.remove('active'));
  const navMap={'dashboard':'navDashboard','ingest':'navIngest','chat':'navChat','documents':'navDocs','search':'navSearch'};
  const btn=document.getElementById(navMap[page]);if(btn)btn.classList.add('active');
  const content=document.getElementById('pageContent');
  if(page==='dashboard')loadDashboard(content);
  else if(page==='ingest')loadIngest(content);
  else if(page==='chat')loadChat(content);
  else if(page==='documents')loadDocuments(content);
  else if(page==='search')loadSearch(content);
}

function loadDashboard(c){
  c.innerHTML='<p>Loading...</p>';
  Promise.all([apiCall('/documents'),apiCall('/chunks')]).then(([docs,chunks])=>{
    c.innerHTML='<h2>📊 Dashboard</h2><p style="color:#888;margin-bottom:15px;">'+(localStorage.getItem('kg_user')||'')+'</p>'+
      '<div class="stats">'+
      '<div class="stat-card"><h3>Documents</h3><p>'+(docs.length||0)+'</p></div>'+
      '<div class="stat-card"><h3>Chunks</h3><p>'+(chunks.length||0)+'</p></div>'+
      '<div class="stat-card"><h3>Entities</h3><p>0</p></div>'+
      '<div class="stat-card"><h3>Queries</h3><p>0</p></div>'+
      '</div>';
  }).catch(e=>{ c.innerHTML='<p style="color:red;">❌ '+e.message+'</p>'; });
}

function loadIngest(c){
  c.innerHTML='<h2>📤 Ingest Document</h2>'+
    '<div class="ingest-section"><h3>📝 Paste Text</h3>'+
    '<div class="form-group"><label>Title</label><input type="text" id="docTitle" placeholder="Enter document title"></div>'+
    '<div class="form-group"><label>Content</label><textarea id="docText" rows="5" placeholder="Paste your text here..."></textarea></div>'+
    '<button class="btn" onclick="ingestText()">Ingest Text</button>'+
    '<div id="ingestStatus" class="mt-10"></div></div>';
}

function ingestText(){
  const title=document.getElementById('docTitle').value;
  const text=document.getElementById('docText').value;
  const status=document.getElementById('ingestStatus');
  if(!title||!text){status.innerHTML='<span style="color:red;">Please enter title and text</span>';return;}
  status.innerHTML='⏳ Ingesting...';
  apiCall('/ingest','POST',{document_id:title.replace(/\s+/g,'_'),title:title,text:text})
    .then(data=>{
      if(data.status==='ingested'||data.status==='cached'){
        status.innerHTML='<span style="color:green;">✅ '+data.status+' ('+(data.chunks||0)+' chunks)</span>';
        document.getElementById('docTitle').value='';document.getElementById('docText').value='';
      } else { status.innerHTML='<span style="color:red;">❌ Ingest failed</span>'; }
    })
    .catch(e=>{ status.innerHTML='<span style="color:red;">❌ '+e.message+'</span>'; });
}

function loadChat(c){
  c.innerHTML='<h2>💬 Chat</h2><div class="chat-box" id="chatBox"><div class="chat-msg bot">👋 Hello! Ask me anything.</div></div>'+
    '<div class="chat-input"><input type="text" id="chatInput" placeholder="Ask a question..." onkeypress="if(event.key===\'Enter\') sendChat()"><button class="btn" onclick="sendChat()">Send</button></div>';
}

function sendChat(){
  const input=document.getElementById('chatInput');
  const box=document.getElementById('chatBox');
  const q=input.value.trim(); if(!q)return;
  box.innerHTML+='<div class="chat-msg user">'+q+'</div>'; input.value='';
  const id='loading-'+Date.now();
  box.innerHTML+='<div class="chat-msg bot" id="'+id+'">⏳ Thinking...</div>';
  box.scrollTop=box.scrollHeight;
  apiCall('/query','POST',{question:q}).then(d=>{
    const el=document.getElementById(id);if(el)el.remove();
    box.innerHTML+='<div class="chat-msg bot">'+(d.answer||'No answer found')+'</div>';
    box.scrollTop=box.scrollHeight;
  }).catch(e=>{
    const el=document.getElementById(id);if(el)el.remove();
    box.innerHTML+='<div class="chat-msg bot" style="color:red;">❌ '+e.message+'</div>';
  });
}

function loadDocuments(c){
  c.innerHTML='<p>Loading...</p>';
  apiCall('/documents').then(docs=>{
    if(!docs||docs.length===0){ c.innerHTML='<h2>📁 Documents</h2><p style="color:#888;">No documents found. <a onclick="showPage(\'ingest\')" style="color:#7c3aed;cursor:pointer;">Ingest your first document</a></p>'; return; }
    let html='<h2>📁 Documents ('+docs.length+')</h2><ul class="doc-list">';
    docs.forEach(d=>{ html+='<li><div><strong>'+(d.title||d.id)+'</strong><span style="color:#888;font-size:12px;display:block;">ID: '+d.id+'</span></div><div class="doc-actions"><button class="btn btn-sm btn-red" onclick="deleteDoc(\''+d.id+'\')">🗑️ Delete</button></div></li>'; });
    html+='</ul>'; c.innerHTML=html;
  }).catch(e=>{ c.innerHTML='<p style="color:red;">❌ '+e.message+'</p>'; });
}

function deleteDoc(id){
  if(!confirm('Delete this document?'))return;
  apiCall('/documents/'+id,'DELETE').then(()=>showPage('documents')).catch(e=>alert('Error: '+e.message));
}

function loadSearch(c){
  c.innerHTML='<h2>🔍 Search Documents</h2><div class="flex"><input type="text" id="searchInput" placeholder="Search your documents..." class="flex-1" style="padding:12px;border:2px solid #ddd;border-radius:8px;"><button class="btn" onclick="performSearch()">Search</button></div><div id="searchResults" class="mt-10"></div>';
}

function performSearch(){
  const q=document.getElementById('searchInput').value.trim();
  const results=document.getElementById('searchResults');
  if(!q){results.innerHTML='<p style="color:#888;">Enter a search term</p>';return;}
  results.innerHTML='<p>⏳ Searching...</p>';
  apiCall('/search?q='+encodeURIComponent(q)).then(data=>{
    if(data.results&&data.results.length>0){
      let html='<p>Found <strong>'+data.total+'</strong> results:</p>';
      data.results.forEach(r=>{ html+='<div class="search-result"><strong>📄 '+r.document_id+'</strong><p style="margin-top:5px;color:#555;">'+r.text+'</p></div>'; });
      results.innerHTML=html;
    } else { results.innerHTML='<p style="color:#888;">No results found</p>'; }
  }).catch(e=>{ results.innerHTML='<p style="color:red;">❌ '+e.message+'</p>'; });
}

document.addEventListener('DOMContentLoaded',()=>{
  if(localStorage.getItem('kg_token')){
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('appSection').classList.remove('hidden');
    showPage('dashboard');
  }
});
</script>
</body>
</html>
