<!DOCTYPE html>
<html>
<head>
<title>MyAI Assistant</title>
<style>
body{font-family:Arial;max-width:600px;margin:40px auto;padding:20px;background:#f0f4ff}
h2{text-align:center}
input,button,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:15px;box-sizing:border-box}
button{background:#7c3aed;color:#fff;border:none;cursor:pointer;font-weight:bold}
button:hover{background:#6d28d9}
.hidden{display:none}
.msg{padding:10px;border-radius:8px;margin:10px 0}
.ok{background:#d4edda;color:#155724}
.err{background:#f8d7da;color:#721c24}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{background:#fff;color:#333;border:2px solid #ddd}
.tabs button.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
hr{margin:20px 0;border:none;border-top:1px solid #ddd}
</style>
</head>
<body>

<h2>🧠 MyAI Assistant</h2>

<!-- AUTH -->
<div id="authBox">
  <div class="tabs">
    <button id="tabLogin" class="active" onclick="switchTab('login')">Login</button>
    <button id="tabReg" onclick="switchTab('reg')">Register</button>
  </div>

  <div id="loginPane">
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="doLogin()">Login</button>
  </div>

  <div id="regPane" class="hidden">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPass" placeholder="Password">
    <button onclick="doRegister()">Register</button>
  </div>

  <div id="authMsg" class="msg hidden"></div>
</div>

<!-- APP -->
<div id="appBox" class="hidden">
  <h3>✅ Logged in</h3>
  <textarea id="docText" rows="4" placeholder="Paste document text..."></textarea>
  <button onclick="doIngest()">Ingest</button>
  <div id="ingestMsg" class="msg hidden"></div>
  <hr>
  <input type="text" id="question" placeholder="Ask a question...">
  <button onclick="doAsk()">Ask</button>
  <div id="answer" class="msg hidden"></div>
  <hr>
  <button style="background:#e74c3c" onclick="doLogout()">Logout</button>
</div>

<script>
const API = 'https://incredible-intuition-production-a491.up.railway.app';
let token = localStorage.getItem('kg_token');

if (token) showApp();

function switchTab(which) {
  document.getElementById('tabLogin').classList.toggle('active', which==='login');
  document.getElementById('tabReg').classList.toggle('active', which==='reg');
  document.getElementById('loginPane').classList.toggle('hidden', which!=='login');
  document.getElementById('regPane').classList.toggle('hidden', which!=='reg');
  hideMsg();
}

function msg(el, text, ok) {
  const e = document.getElementById(el);
  e.textContent = text;
  e.className = 'msg ' + (ok ? 'ok' : 'err');
  e.classList.remove('hidden');
}
function hideMsg() { document.getElementById('authMsg').classList.add('hidden'); }

async function doRegister() {
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPass').value;
  if (!email || !password) return msg('authMsg','Enter email and password', false);
  try {
    const res = await fetch(API+'/auth/register', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (res.ok) {
      msg('authMsg','✅ Registered! Now click the Login tab.', true);
      switchTab('login');
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPass').value = password;
    } else {
      msg('authMsg','❌ ' + (data.detail || 'Registration failed'), false);
    }
  } catch(e) {
    msg('authMsg','❌ ' + e.message, false);
  }
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPass').value;
  if (!email || !password) return msg('authMsg','Enter email and password', false);
  try {
    const fd = new URLSearchParams();
    fd.append('username', email);
    fd.append('password', password);
    const res = await fetch(API+'/auth/login', {method:'POST', body:fd});
    const data = await res.json();
    if (res.ok) {
      token = data.access_token;
      localStorage.setItem('kg_token', token);
      msg('authMsg','✅ Login successful!', true);
      setTimeout(showApp, 400);
    } else {
      msg('authMsg','❌ ' + (data.detail || 'Invalid credentials'), false);
    }
  } catch(e) {
    msg('authMsg','❌ ' + e.message, false);
  }
}

function showApp() {
  document.getElementById('authBox').classList.add('hidden');
  document.getElementById('appBox').classList.remove('hidden');
}

function doLogout() {
  localStorage.removeItem('kg_token');
  location.reload();
}

async function doIngest() {
  const text = document.getElementById('docText').value;
  if (!text) return msg('ingestMsg','Enter some text', false);
  msg('ingestMsg','⏳ Ingesting...', true);
  try {
    const res = await fetch(API+'/ingest', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify({document_id:'doc_'+Date.now(), title:'Doc', text})
    });
    const data = await res.json();
    msg('ingestMsg', res.ok ? '✅ ' + data.status : '❌ ' + (data.detail||'Failed'), res.ok);
  } catch(e) { msg('ingestMsg','❌ ' + e.message, false); }
}

async function doAsk() {
  const question = document.getElementById('question').value;
  if (!question) return;
  msg('answer','⏳ Thinking...', true);
  try {
    const res = await fetch(API+'/query', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify({question})
    });
    const data = await res.json();
    msg('answer', res.ok ? '📝 ' + data.answer : '❌ ' + (data.detail||'Failed'), res.ok);
  } catch(e) { msg('answer','❌ ' + e.message, false); }
}
</script>

</body>
</html>
