<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DocuAI Simple Interface</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 540px; margin: 40px auto; padding: 20px; background: #f8fafc; }
        .card { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #cbd5e1; }
        button { background: #4f46e5; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #4338ca; }
        .hidden { display: none; }
        .error { color: #dc2626; font-size: 13px; }
        .success { color: #16a34a; font-size: 13px; }
        #answer { margin-top: 15px; padding: 12px; background: #f1f5f9; border-radius: 8px; white-space: pre-wrap; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0; color:#1e293b;">🧠 DocuAI Assistant</h2>
    <p style="font-size:13px; color:#64748b; margin-top:-6px;">Lightweight Document Chat</p>

    <div id="loginDiv">
        <h3>Sign In</h3>
        <input type="email" id="email" value="newuser@email.com" placeholder="Email">
        <input type="password" id="password" value="securepass123" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="msg"></p>
    </div>

    <div id="appDiv" class="hidden">
        <p style="color:#16a34a; font-weight:600;">✅ Connected</p>
        <input type="text" id="question" placeholder="Ask a question about your documents..." onkeydown="if(event.key==='Enter') ask()">
        <button onclick="ask()">Ask DocuAI</button>
        <div id="answer"></div>
        <button onclick="logout()" style="background:#ef4444; margin-top:20px;">Logout</button>
    </div>
</div>

<script>
    const API = (window.location.protocol.startsWith('http')) ? window.location.origin : 'http://localhost:8000';
    let token = localStorage.getItem('docuai_token');

    if (token) {
        document.getElementById('loginDiv').classList.add('hidden');
        document.getElementById('appDiv').classList.remove('hidden');
    }

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msg = document.getElementById('msg');
        msg.textContent = 'Connecting...';

        try {
            const fd = new URLSearchParams();
            fd.append('username', email);
            fd.append('password', password);

            const res = await fetch(API + '/auth/login', { method: 'POST', body: fd });
            const data = await res.json();

            if (res.ok) {
                token = data.access_token;
                localStorage.setItem('docuai_token', token);
                msg.innerHTML = '<span class="success">✅ Login successful!</span>';
                setTimeout(() => {
                    document.getElementById('loginDiv').classList.add('hidden');
                    document.getElementById('appDiv').classList.remove('hidden');
                }, 400);
            } else {
                msg.innerHTML = '<span class="error">❌ ' + (data.detail || 'Login failed') + '</span>';
            }
        } catch(e) {
            msg.innerHTML = '<span class="error">❌ Cannot reach backend at ' + API + '</span>';
        }
    }

    async function ask() {
        const question = document.getElementById('question').value;
        const answerDiv = document.getElementById('answer');
        if (!question) return;

        answerDiv.innerHTML = '⏳ Thinking...';

        try {
            const res = await fetch(API + '/query', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            });
            const data = await res.json();
            answerDiv.innerHTML = '<strong>Answer:</strong>\n' + (data.answer || 'No answer');
        } catch(e) {
            answerDiv.innerHTML = '❌ ' + e.message;
        }
    }

    function logout() {
        localStorage.removeItem('docuai_token');
        location.reload();
    }
</script>

</body>
</html>
